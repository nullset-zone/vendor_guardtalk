# GuardTalkOS komodo wpa_supplicant overlay (T-REMEDIATE-B4-WIFI-GW).
# Pixel baseline plus fail-closed SSID filter. Replaces
# vendor/google_devices/komodo/proprietary/vendor/etc/wifi/wpa_supplicant_overlay.conf
# via late PRODUCT_COPY_FILES. Do not re-enable RIL/BT/NFC. Do not open Wi-Fi.
sae_pwe=2
driver_param=use_p2p_group_interface=1p2p_device=1
disable_scan_offload=1
wowlan_triggers=any
bss_max_count=512
# Passpoint / HS2.0 is a non-gateway join path; keep off (Pixel had 1).
interworking=0
hs20=0
auto_interworking=0
bss_no_flush_when_down=1
btm_offload=1
sae_pmkid_in_assoc=1
# After a privileged app saves the GMP SSID, scan/associate only that set.
# Empty saved-network set does not filter (wpa_supplicant); first-user
# no_add_wifi_config still blocks Settings add/tap-connect.
filter_ssids=1
